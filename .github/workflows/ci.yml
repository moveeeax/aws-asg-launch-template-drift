name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Smoke the CLI against a fixture
        run: |
          set +e
          aws-asg-launch-template-drift --from-json tests/fixtures/prod.json \
            --max-age-days 36500 --fail-on critical
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          aws-asg-launch-template-drift --from-json tests/fixtures/prod.json --format json >/dev/null
          aws-asg-launch-template-drift --from-json tests/fixtures/prod.json --format markdown
